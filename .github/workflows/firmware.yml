# Compile the ESP32 firmware.
#
# Deliberately a separate workflow from ci.yml, and deliberately not part of it.
# PlatformIO has to download an xtensa toolchain and the Arduino ESP32 core,
# which is roughly 400 MB and several minutes on a cold cache. Paying that on
# every push to a Python service would be most of the repository's CI time spent
# rebuilding firmware that had not changed.
#
# So it runs only when something under edge/firmware changes, or when asked. On
# a normal push it costs nothing at all.
#
# What this proves: the firmware compiles against the pinned library versions,
# for both targets. What it does not prove: anything about how it behaves on
# hardware. There is no board behind this repository. See docs/limitations.md.

name: Firmware

on:
  push:
    branches: [main]
    paths:
      - "edge/firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "edge/firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # Both boards from one firmware. If one target breaks, seeing the other
      # finish tells you whether the cause is the code or the platform.
      fail-fast: false
      matrix:
        environment: [esp32dev, esp32c3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the PlatformIO toolchain
        # The whole point of this cache. Without it every run downloads the
        # xtensa toolchain and the ESP32 core again, which is the bulk of the
        # job's runtime.
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('edge/firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.environment }}-
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio==6.1.16

      - name: Provide a build configuration
        # config.h holds a device's identity and private key, so it is gitignored
        # and never exists in a checkout. The example has the same structure with
        # placeholder values, which is all a compile needs: the certificates are
        # string literals and nothing validates them until runtime.
        working-directory: edge/firmware
        run: cp include/config.h.example include/config.h

      - name: Compile
        working-directory: edge/firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Report the size
        # Worth printing. An ESP32 partition is typically 1.3 MB and it is easy
        # to add a library that quietly takes most of it.
        working-directory: edge/firmware
        run: pio run -e ${{ matrix.environment }} -t size
