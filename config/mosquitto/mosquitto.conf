# Mosquitto configured to behave like AWS IoT Core as closely as a local broker can.
#
# There is exactly one listener and it demands mutual TLS. No anonymous access, no
# plaintext port, no username and password fallback. The only way in is a client
# certificate that chains to the CA in certs/ca and is not on the CRL, which is the
# same door AWS IoT Core presents.

per_listener_settings true

listener 8883
protocol mqtt

# --- Server side of the handshake ------------------------------------------
certfile /mosquitto/certs/server/mosquitto.crt
keyfile  /mosquitto/certs/server/mosquitto.key

# --- Client side of the handshake ------------------------------------------
# cafile is the trust anchor for client certificates. require_certificate turns the
# handshake into mutual TLS, so a client with no certificate is rejected before it
# can send a CONNECT packet.
cafile /mosquitto/certs/ca/ca.crt
require_certificate true

# The certificate common name becomes the MQTT username. Everything in the ACL file
# keys off %u, so identity comes from the TLS layer and never from the payload.
use_identity_as_username true

# Revocation. scripts/pki.sh revoke regenerates this list; a revoked device is
# refused at the handshake rather than being left to publish until its certificate
# expires.
crlfile /mosquitto/certs/ca/ca.crl

allow_anonymous false
acl_file /mosquitto/config/acl

# --- Sizing ----------------------------------------------------------------
# max_inflight_messages caps unacknowledged QoS 1 publishes per client. The default
# of 20 throttles a simulator that bursts, so it is raised here. The queue limit
# bounds memory when a subscriber falls behind.
max_inflight_messages 100
max_queued_messages 10000
# max_packet_size caps a single MQTT packet. A telemetry message is well under a
# kilobyte, so 64 KiB is generous and still refuses anything absurd.
max_packet_size 65536

# Persistence is off on purpose. The broker is a transport, not a store of record:
# durability belongs to Redpanda and TimescaleDB downstream. A broker restart should
# lose nothing that has already been acknowledged into the stream.
persistence false

# --- Logging ---------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
