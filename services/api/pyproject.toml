[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-api"
version = "1.0.0"
description = "Query API over TimescaleDB with a live WebSocket feed"
requires-python = ">=3.11"
dependencies = [
    "telemetry-common",
    "fastapi==0.115.2",
    "uvicorn[standard]==0.32.0",
    "asyncpg==0.29.0",
    "aiokafka[lz4]==0.11.0",
    "prometheus-client==0.21.0",
    "websockets==13.1",
]

[project.scripts]
telemetry-api = "api.main:main"

[tool.setuptools.packages.find]
include = ["api*"]
