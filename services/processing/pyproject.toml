[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-processing"
version = "1.0.0"
description = "Stream processing and rollups for the IoT telemetry platform"
requires-python = ">=3.11"
dependencies = [
    "telemetry-common",
    # The lz4 extra, not a bare lz4 pin: aiokafka 0.11 routes every codec
    # through cramjam, and installing lz4 on its own leaves the producer
    # unable to find a compressor at runtime.
    "aiokafka[lz4]==0.11.0",
    "asyncpg==0.29.0",
    "prometheus-client==0.21.0",
]

[project.scripts]
telemetry-processing = "processing.main:main"

[tool.setuptools.packages.find]
include = ["processing*"]
