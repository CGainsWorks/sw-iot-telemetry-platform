[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-simulator"
version = "1.0.0"
description = "Synthetic device fleet publishing telemetry over MQTT with per-device TLS identity"
requires-python = ">=3.11"
dependencies = [
    "telemetry-common",
    "aiomqtt==2.3.0",
]

[project.scripts]
telemetry-simulator = "telemetry_simulator.cli:main"

[tool.setuptools.packages.find]
include = ["telemetry_simulator*"]
