; ESP32 firmware for the telemetry platform.
;
; Compiled in CI, never flashed. There is no hardware behind this repository, so
; what is verified is that it builds against the pinned libraries and that the
; JSON it produces matches the published schema. Everything about how it behaves
; on a real board, power draw, antenna performance, how the BME280 self-heats
; inside an enclosure, is unverified. docs/limitations.md says so plainly.
;
;   make firmware-build        compile in a container
;   pio run -e esp32dev        compile locally if PlatformIO is installed
;   pio run -e esp32dev -t upload   flash a board, if you have one

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200

; Pinned exactly. An Arduino library that resolves to "latest" turns a
; reproducible firmware build into a lottery, and a firmware you cannot rebuild
; byte for byte is a firmware you cannot debug a field failure in.
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.0
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit Unified Sensor@1.1.14

build_flags =
    -Wall
    -Wextra
    ; PubSubClient defaults to a 256 byte buffer, which silently truncates a
    ; publish rather than failing it. A telemetry message with six readings is
    ; around 320 bytes, so the default would drop every message.
    -DMQTT_MAX_PACKET_SIZE=1024
    ; The default 15 second socket timeout stalls the main loop on a bad link.
    -DMQTT_SOCKET_TIMEOUT=5

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev

[env:esp32c3]
; Cheaper and lower power, same firmware, same flags.
;
; Deliberately no ARDUINO_USB_CDC_ON_BOOT here. On the C3 that flag rebinds
; Serial to the built-in USB CDC peripheral, which only compiles when
; ARDUINO_USB_MODE is set alongside it; on its own it leaves Serial undeclared
; and every Serial.printf in the firmware fails to compile. Logging over the
; UART works on both targets and keeps one set of flags, so the convenience is
; not worth the divergence.
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
