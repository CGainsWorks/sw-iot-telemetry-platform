apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
  labels:
    app.kubernetes.io/part-of: iot-telemetry-platform
    # Enforce the restricted Pod Security Standard. Every workload here runs
    # unprivileged as a non-root user with no capabilities, so this costs
    # nothing and stops a future addition quietly running as root.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-platform
  namespace: telemetry
  annotations:
    # Filled in by the overlay with the workload_role_arn Terraform outputs.
    # IRSA exchanges the pod's projected service account token for AWS
    # credentials, so nothing static is mounted and nothing has to be rotated.
    eks.amazonaws.com/role-arn: "REPLACE_WITH_WORKLOAD_ROLE_ARN"
---
# Default deny. Without it every pod in the namespace can reach every other pod
# and anything else in the cluster, which makes the careful work on the broker
# ACL rather beside the point.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: telemetry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-internal
  namespace: telemetry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Services in this namespace talk to each other freely: the API reads the
    # database, processing writes it, everything scrapes everything's metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry
    # Prometheus, wherever it lives, needs to reach the metrics ports.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9100
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-web-and-api
  namespace: telemetry
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [web, api]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
          protocol: TCP
        - port: 8000
          protocol: TCP
