# EXAMPLE ONLY. Do not apply this file and do not put real values in it.
#
# These are created empty by Terraform and filled out of band, because a secret
# committed to a repository is a secret that has been disclosed, and a secret in
# Terraform state is a secret in a file on someone's laptop.
#
# In a real cluster, use one of:
#
#   External Secrets Operator, reading AWS Secrets Manager
#     the values never exist in the repository or in Git history
#
#   Sealed Secrets
#     encrypted with the cluster's public key, safe to commit
#
#   sops with a KMS key
#     encrypted at rest, decrypted at apply time
#
# To create them by hand for a development cluster:
#
#   kubectl -n telemetry create secret generic telemetry-secrets \
#     --from-literal=PG_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=ALERT_WEBHOOK_URL="https://hooks.example.com/..."
#
#   kubectl -n telemetry create secret generic ingest-client-certificate \
#     --from-file=ca/ca.crt=certs/ca/ca.crt \
#     --from-file=services/ingest-bridge.crt=certs/services/ingest-bridge.crt \
#     --from-file=services/ingest-bridge.key=certs/services/ingest-bridge.key

apiVersion: v1
kind: Secret
metadata:
  name: telemetry-secrets
  namespace: telemetry
type: Opaque
stringData:
  PG_PASSWORD: "REPLACE_ME"
  ALERT_WEBHOOK_URL: ""
